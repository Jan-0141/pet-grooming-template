<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Pet grooming template website" />
  <title>Happy Paws Grooming</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css" />
  <link id="theme-stylesheet" rel="stylesheet" href="css/themes/theme-peach.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="#home" aria-label="Home">
        <span class="brand-mark">🐾</span>
        <span id="brand-name">Happy Paws Grooming</span>
      </a>
      <button id="menu-toggle" class="menu-toggle" aria-label="Open menu">☰</button>
      <nav id="main-nav" class="main-nav">
        <a href="#home">Home</a>
        <a href="#services">Services</a>
        <a href="#gallery">Gallery</a>
        <a href="#about">About</a>
        <a href="#reviews">Reviews</a>
        <a href="#contact">Contact</a>
        <a id="header-booking" class="btn btn-primary" href="#contact">Book Appointment</a>
      </nav>
    </div>
  </header>

  <main id="app"></main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div>
        <div class="brand footer-brand"><span class="brand-mark">🐾</span><span id="footer-name">Happy Paws Grooming</span></div>
        <p id="footer-tagline" class="muted"></p>
      </div>
      <div>
        <h4>Quick Links</h4>
        <div class="footer-links">
          <a href="#services">Services</a>
          <a href="#gallery">Gallery</a>
          <a href="#about">About</a>
          <a href="#contact">Contact</a>
        </div>
      </div>
      <div>
        <h4>Contact</h4>
        <p id="footer-contact" class="muted"></p>
      </div>
    </div>
    <div class="container copyright">© <span id="year"></span> <span id="copyright-name"></span>. All rights reserved.</div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>

</html>
